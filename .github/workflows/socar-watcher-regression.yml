name: Socar watcher regression

on:
  pull_request:
    branches: [socar/v1.15.0-watcher-fallback-off]
    paths:
      - cosmos/airflow/_override.py
      - cosmos/operators/_watcher/**
      - cosmos/operators/_k8s_common.py
      - cosmos/operators/watcher_kubernetes.py
      - cosmos/operators/watcher_gcp_gke.py
      - tests/airflow/test_override.py
      - tests/operators/_watcher/**
      - tests/operators/test_k8s_common.py
      - tests/operators/test_watcher_kubernetes_unit.py
      - tests/conftest.py
      - pyproject.toml
      - requirements/requirements-airflow-2.10-dbt-1.11.txt
      - scripts/test/**
      - .github/workflows/socar-watcher-regression.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  watcher-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AIRFLOW_HOME: /tmp/socar-watcher-airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      SCARF_NO_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install the canonical test environment
        run: |
          python -m pip install "hatch>=1.14.2"
          hatch -e tests.py3.11-2.10-1.9 run python -m pip install \
            "apache-airflow==2.10.5" "apache-airflow-providers-cncf-kubernetes==10.10.0"
      - name: Verify the incident runtime versions
        # The canonical matrix name is 1.9, but its bootstrap reads the dbt 1.11 requirements.
        run: |
          hatch -e tests.py3.11-2.10-1.9 run python -c '
          from importlib.metadata import version
          for package, expected in {"apache-airflow": "2.10.5", "apache-airflow-providers-cncf-kubernetes": "10.10.0"}.items():
              actual = version(package)
              print(f"{package}=={actual}")
              assert actual == expected, (package, actual, expected)
          for package in ("dbt-core", "kubernetes", "urllib3"):
              print(f"{package}=={version(package)}")
          '
      - name: Run the focused watcher and terminal-log regressions
        env:
          # unit.sh does not forward positional arguments; pytest reads these directly.
          PYTEST_ADDOPTS: >-
            tests/airflow/test_override.py
            tests/operators/_watcher/test_watcher_base.py
            tests/operators/_watcher/test_xcom.py
            tests/operators/test_k8s_common.py
            tests/operators/test_watcher_kubernetes_unit.py
        run: hatch run tests.py3.11-2.10-1.9:test
